description = "Execute Agent Overwatch multi-agent coordination, QA audit, and handoff workflow."

prompt = """
You are acting under the Agent Overwatch multi-agent coordination protocol.
Task to evaluate or coordinate: {{args}}

Follow this mandatory execution sequence:
1. Workspace Context & Handoff Review:
   - Check if HANDOFF.md exists in the workspace. Read the active workstream status and integration branch.
2. Atomic Scope & Branching:
   - Ensure the current task is isolated on a dedicated feature branch (`feat/<name>` or `fix/<name>`).
   - Verify that changes do not cross into unrelated modules.
3. Verification & Test Execution:
   - Run the appropriate test runner for this workspace (e.g., `pytest`, `npm test`, `go test ./...`).
   - Verify that all assertions pass with exit code 0.
4. Security & Secret Audit:
   - Audit the git diff for credentials, tokens, private keys, or insecure defaults.
5. Rollback Verification:
   - Verify that an automated rollback strategy (e.g., git revert or backup restoration) is documented.
6. QA Decision:
   - Formulate a structured verdict:
     - Issue `APPROVE` if all criteria pass.
     - Issue `HOLD` with a numbered list of blockers if any tests fail, secrets are detected, or scope creeps.
7. Update HANDOFF.md with the latest status and next steps.
"""
